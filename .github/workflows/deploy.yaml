name: Deploy documentation to GitHub Pages

# Builds the site and pushes it to the gh-pages branch, which GitHub Pages serves
# (repo Settings › Pages › Source: "Deploy from a branch", gh-pages, / (root)).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (fails on broken links)
        run: npm run build
        env:
          # Where the site is published: https://wrteam-in.github.io/edrama-doc/
          DOCS_URL: https://wrteam-in.github.io
          DOCS_BASE_URL: /edrama-doc/

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
